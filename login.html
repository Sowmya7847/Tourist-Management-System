<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Auth System</title>
    <style>
        body {
            font-family: 'Cinzel', serif; /* Mughal-style elegant font */
            background-color: #f0e6d6; /* Light golden background for Mughal theme */
            color: #5c4033; /* Rich, earthy color */
            margin: 0;
            padding: 0;
            text-align: center;
            transition: background 0.5s, color 0.5s;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #DAA520; /* Golden border for Mughal touch */
        }

        .hidden {
            display: none;
        }

        h2 {
            font-size: 28px;
            color: #DAA520; /* Rich gold for the header */
            font-family: 'Great Vibes', cursive; /* Decorative Mughal-style font */
        }

        .btn {
            padding: 12px;
            margin: 12px 0;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #DAA520; /* Gold color for buttons */
            color: white;
            transition: transform 0.3s, background-color 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            background-color: #B8860B; /* Darker gold on hover */
        }

        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #DAA520;
            border-radius: 5px;
            background-color: #f4e1b7; /* Light golden background for input fields */
        }

        input:focus {
            border-color: #B8860B; /* Darker gold border on focus */
            outline: none;
        }

        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            background-color: #DAA520;
            border: none;
            padding: 8px;
            border-radius: 5px;
            color: white;
        }

        .theme-toggle:hover {
            background-color: #B8860B;
        }

        .back-btn {
            font-size: 14px;
            color: #DAA520;
            text-decoration: none;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* Mughal styled marquee */
        marquee {
            font-family: 'Great Vibes', cursive;
            font-size: 24px;
            color: #DAA520;
            background-color: #5c4033;
            padding: 10px;
            border-radius: 10px;
        }

        .footer {
            margin-top: 40px;
            font-size: 16px;
            color: #DAA520;
        }

    </style>

    <!-- Google Fonts for Mughal Style -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Switch Theme</button>

    <!-- Mughal Styled Marquee -->
    <marquee behavior="scroll" direction="left">Welcome to the Tourist Management Login</marquee>

    <!-- Login Page Content -->
    <div class="container" id="welcome-page">
        <h2>Welcome!</h2>
        <button class="btn" onclick="showPage('signup-page')">Sign Up</button>
        <button class="btn" onclick="showPage('login-page')">Log In</button>
    </div>

    <div class="container hidden" id="signup-page">
        <h2>Sign Up</h2>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <button class="btn" id="signup-btn">Sign Up</button>
        <a href="javascript:void(0)" onclick="showPage('welcome-page')" class="back-btn">Back</a>
    </div>

    <div class="container hidden" id="login-page">
        <h2>Log In</h2>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button class="btn" id="login-btn">Log In</button>
        <a href="javascript:void(0)" onclick="showPage('forgot-password-page')" class="back-btn">Forgot Password?</a><br>
        <a href="javascript:void(0)" onclick="showPage('welcome-page')" class="back-btn">Back</a>
    </div>

    <div class="container hidden" id="forgot-password-page">
        <h2>Reset Password</h2>
        <input type="email" id="reset-email" placeholder="Enter your email" required>
        <button class="btn" id="reset-btn">Reset Password</button>
        <a href="javascript:void(0)" onclick="showPage('login-page')" class="back-btn">Back</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCp_7_xqIG00Bs1gjtc7uJ7s07pVl9YSNI",
            authDomain: "gen-lang-client-0390367057.firebaseapp.com",
            projectId: "gen-lang-client-0390367057",
            storageBucket: "gen-lang-client-0390367057.firebasestorage.app",
            messagingSenderId: "28571667369",
            appId: "1:28571667369:web:5652c6d8cc5bf9e916d2b8",
            measurementId: "G-NHR3JNZB4E"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        document.getElementById("signup-btn").addEventListener("click", () => {
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;
            
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => alert("Signup successful!"))
                .catch((error) => alert(error.message));
        });

        document.getElementById("login-btn").addEventListener("click", () => {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            
            signInWithEmailAndPassword(auth, email, password)
                .then(() => window.location.href = "home.html")
                .catch((error) => alert(error.message));
        });

        document.getElementById("reset-btn").addEventListener("click", () => {
            const email = document.getElementById("reset-email").value;
            sendPasswordResetEmail(auth, email)
                .then(() => alert("Password reset email sent!"))
                .catch((error) => alert(error.message));
        });
    </script>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.container').forEach(div => div.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function toggleTheme() {
            document.body.classList.toggle("dark-theme");
            if (document.body.classList.contains("dark-theme")) {
                document.body.style.background = "#1e1e2e";
                document.body.style.color = "#ffffff";
            } else {
                document.body.style.background = "#f0e6d6";
                document.body.style.color = "#5c4033";
            }
        }
           <a href="home.html" target="_blank" style="text-decoration: none;">
    </script>
</body>
</html>
